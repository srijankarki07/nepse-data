name: Daily prices

# Fetches the session and commits it. This is the whole point of the repository.
#
# ## Why the schedule runs every day
#
# **NEPSE's trading week is not fixed, and this repository learned that the hard way.**
# Its own archive shows the week changing mid-history:
#
#   - Sunday to Thursday sessions from 2011 until **2026-04-05**;
#   - Monday to **Friday** sessions from **2026-04-10** onwards.
#
# A cron written for the old week (`0-4`, Sunday through Thursday) would have silently
# stopped fetching every Friday from April 2026 — about a fifth of the year, missing from
# the archive with nothing anywhere reporting a failure. That is precisely the silent gap
# this repository exists to prevent, and it went unnoticed for months because the schedule
# looked like it was working.
#
# So the schedule does not encode a trading week at all. It runs **daily**, and a day the
# market was shut costs one request and commits nothing: the source keeps reporting the
# previous session, whose file is already archived and byte-identical. Two wasted runs a
# week is a far better trade than a silent hole that surfaces months later, and it stays
# correct the next time the exchange changes its week.
#
# `15 10` is 10:15 UTC, which is 16:00 in Kathmandu (UTC+05:45) — an hour after the close,
# so final figures have been published, and early enough that the rest of the day is left
# free if the run needs retrying by hand.
#
# ## Why the commit matters beyond the data
#
# GitHub disables scheduled workflows after **60 days of repository inactivity**. A job
# that only called an external API and never touched the repository would be switched
# off silently — and the discovery would be a gap in the archive. Committing the day's
# file is what keeps the schedule alive, so the design defect is avoided by the design
# itself rather than by a workaround.

on:
  schedule:
    # Every day, deliberately — see the note above on why the trading week is not
    # encoded here. A closed day is a no-op.
    - cron: "15 10 * * *"
  # So a failed or missed day can be picked up without waiting for tomorrow. Safe to
  # press repeatedly: re-fetching a session already archived writes nothing.
  workflow_dispatch:

permissions:
  contents: write

# Never two at once. A manual dispatch during a scheduled run would otherwise race on
# the same file.
concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The format is checked before the fetch, not after: a parser that has silently
      # stopped working should fail the run rather than commit an empty day.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Fetch the session
        # Not `pnpm fetch` — that is a pnpm built-in which populates the package store,
        # exits 0 and archives nothing. See the note in src/cli.ts.
        run: pnpm scrape

      - name: Commit if anything changed
        run: |
          git add data

          if git diff --cached --quiet; then
            echo "Nothing to commit — the session is already archived."
            exit 0
          fi

          SESSION=$(git diff --cached --name-only -- data | head -1 | xargs -r basename | sed 's/\.csv$//')
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: ${SESSION:-session} end-of-day prices"
          git push
