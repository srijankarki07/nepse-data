name = "nepse-dispatch"
main = "worker.js"

# Pinned and in the past: a compatibility date fixes the runtime's behaviour so a future
# workerd release cannot change what this does without a commit here.
compatibility_date = "2026-01-01"

# The first tick is 09:20 UTC, which is 3:05 PM NPT, five minutes after NEPSE's 3:00 PM
# close, and gives the run a moment to start before the source is expected to publish.
#
# The second is a re-attempt for the day a source publishes late: if the first succeeded,
# this one finds the session already archived, commits nothing and costs about forty
# seconds. It is spaced well past the first run's budget so it cannot evict it. See the
# note on concurrency in .github/workflows/daily.yml.
#
# The third covers the case the second cannot. On 2026-10-26, the first session after a
# seven-day closure, the source published around 4:18 PM NPT (10:33 UTC), seconds after
# the second run's budget expired. That left the day to GitHub's cron backstop, which had
# already dropped its 4:00 PM NPT slot. A tick at 6:05 PM NPT (12:20 UTC) reads a source
# that has had three more hours to settle, and on a day the session is already archived
# it is a no-op like the other two.
#
# None of them encodes a trading week. The Worker fires on Saturday and Sunday too, and a
# closed day is a no-op. That is deliberate and hard-won; daily.yml explains why.
[triggers]
# Cloudflare reads these in UTC; Kathmandu is UTC+5:45.
crons = ["20 9 * * *", "7 10 * * *", "20 12 * * *"]  # 3:05 PM, 3:52 PM, 6:05 PM NPT

[vars]
GITHUB_REPO = "srijankarki07/nepse-data"
WORKFLOW_FILE = "daily.yml"
REF = "main"

# Minutes the job should wait for the session to appear. Must be a string, because every
# workflow input is one.
#
# Twenty-five covers 3:05 PM to roughly 3:32 PM NPT including the runner's startup, which
# is the half-hour target and a little margin. Raising it only costs anything on a closed
# day, where the job waits out the whole budget. That is the honest price of not encoding a
# trading week anywhere.
WAIT_MINUTES = "25"

# GITHUB_TOKEN is a secret, not a var. Set it with `wrangler secret put GITHUB_TOKEN`; it
# must never appear in this file. See README.md for the permissions it needs and why.

[observability]
enabled = true
